function resizeGameCanvas(){
  const rect=cv.getBoundingClientRect();

  const targetH=Math.max(H,Math.round(rect.height*dpr));
  if(cv.width!==targetW||cv.height!==targetH){cv.width=targetW;cv.height=targetH;}
  const sx=targetW/W,sy=targetH/H;
  renderScale=Math.min(sx,sy);
  g.setTransform(sx,0,0,sy,0,0);
}

function tr(s){if(language==='es')return String(s);let out=String(s),d=LANG[language]||{};if(d[out])return d[out];for(const [a,b] of Object.entries(d).sort((x,y)=>y[0].length-x[0].length))if(out.includes(a))out=out.split(a).join(b);return out}
function txt(s,x,y,size,col,al,font){s=tr(s);g.font=`${font||'bold'} ${size}px Georgia,serif`;g.textAlign=al||'center';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function button(label,x,y,w,h){
  const hov=mouse.x>x&&mouse.x<x+w&&mouse.y>y&&mouse.y<y+h;
  g.save();rr(x,y,w,h,10);g.fillStyle=hov?'#f2c21b':'rgba(18,18,24,.94)';g.fill();
  g.lineWidth=2;g.strokeStyle=hov?'#ffe48a':'#f2c21b';g.stroke();
  // Ajustar automáticamente el tamaño para que ninguna etiqueta salga del botón.
  const shown=tr(label);let fs=Math.min(26,Math.max(13,h*.48));
  g.font=`bold ${fs}px Georgia,serif`;
  while(g.measureText(shown).width>w-24&&fs>12){fs-=1;g.font=`bold ${fs}px Georgia,serif`;}
  g.textAlign='center';g.textBaseline='middle';g.fillStyle=hov?'#111':'#f2c21b';g.fillText(shown,x+w/2,y+h/2,Math.max(10,w-20));g.restore();
  if(hov&&mouse.click){mouse.click=false;return true}return false;
}

function drawBlueArmTeaser(x,y,s,phase){
  g.save();g.translate(x,y);g.scale(s,s);g.rotate(-.12+Math.sin(phase*.025)*.025);
  // Brazo azul peludo que entra desde el borde superior derecho.
  const arm=g.createLinearGradient(-20,0,34,150);arm.addColorStop(0,'#4d8cff');arm.addColorStop(.45,'#2460df');arm.addColorStop(1,'#102e86');
  g.fillStyle=arm;rr(-8,-28,54,145,22);g.fill();
  for(let i=0;i<74;i++){const xx=-5+sr(i*2.31)*49,yy=-8+sr(i*4.7)*118;g.strokeStyle=i%2?'#6da4ff':'#153a9b';g.lineWidth=1.4+sr(i*1.4);g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+(sr(i*8)-.5)*9,yy+5+sr(i*9)*8);g.stroke()}

  g.fillStyle='rgba(255,241,150,.65)';g.beginPath();g.ellipse(8,118,10,5,-.5,0,Math.PI*2);g.fill();
  g.restore();
}

  g.restore();
}

/* ---------- Dibujos de personajes ---------- */
const sr=x=>{const v=Math.sin(x*12.9898)*43758.5453;return v-Math.floor(v)};
function furEdge(rx,ry,n,len,cols,seed,wob){
  g.lineCap='round';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,r1=sr(i*7.1+seed),r2=sr(i*3.7+seed+1),L=len*(.5+r1),dev=(r2-.5)*.7+Math.sin(t*.05+i)*(wob||.05);
    g.strokeStyle=cols[i%cols.length];g.lineWidth=2.5+r2*2.5;g.beginPath();
    g.moveTo(Math.cos(a)*rx*.93,Math.sin(a)*ry*.93);
    g.lineTo(Math.cos(a)*rx+Math.cos(a+dev)*L,Math.sin(a)*ry+Math.sin(a+dev)*L);g.stroke();
  }
}
// Monstruo azul peludo de sonrisa enorme (capítulo 1)

  const fur=['#1f4fd0','#2f6bff','#173d9e'],det=s>.5,art=artOn();
  if(art)furEdge(64,68,90,26,['#3a74f5','#2556d6','#0f2a78'],21,.09);
  if(det)furEdge(64,68,64,20,fur,3);
  g.fillStyle='#2556d6';g.beginPath();g.ellipse(0,0,64,68,0,0,7);g.fill();
  if(art){const sh=g.createRadialGradient(-22,-30,6,0,0,80);sh.addColorStop(0,'rgba(140,190,255,.45)');sh.addColorStop(.5,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,10,50,.55)');g.fillStyle=sh;g.beginPath();g.ellipse(0,0,64,68,0,0,7);g.fill()}
  g.fillStyle='#3a74f5';g.beginPath();g.ellipse(-14,-38,34,18,-.3,0,7);g.fill();
  if(det){g.lineWidth=2;for(let i=0;i<(art?150:46);i++){const x=(sr(i*2.3)-.5)*110,y=(sr(i*5.1)-.5)*120;if(x*x/3600+y*y/4300>.9)continue;
    g.strokeStyle=i%2?'rgba(120,170,255,.55)':'rgba(10,30,110,.5)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(sr(i)-.5)*10,y+7+sr(i*1.7)*7);g.stroke()}}
  for(const ex of[-27,27]){
    g.fillStyle='#050510';g.beginPath();g.ellipse(ex,-24,14,16,0,0,7);g.fill();
    g.fillStyle=rage?'#ff2a2a':'#fff';g.beginPath();g.arc(ex+(ex>0?-3:3),-28,rage?4:3,0,7);g.fill();
    if(art){g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(ex+(ex>0?3:-3),-20,1.8,0,7);g.fill();g.strokeStyle='rgba(120,180,255,.35)';g.lineWidth=1.5;g.beginPath();g.arc(ex,-24,12,.2,1.6);g.stroke()}
  }
  g.strokeStyle='#0a1a52';g.lineWidth=rage?9:6;g.beginPath();
  if(rage){g.moveTo(-46,-50);g.lineTo(-12,-36);g.moveTo(46,-50);g.lineTo(12,-36)}
  else{g.moveTo(-44,-46);g.quadraticCurveTo(-27,-54,-10,-46);g.moveTo(44,-46);g.quadraticCurveTo(27,-54,10,-46)}
  g.stroke();
  const mh=open?(rage?60:34):12,y0=14,LD=mh*2.1+10;
  g.fillStyle='#14040a';g.beginPath();g.moveTo(-54,y0);g.quadraticCurveTo(0,y0-10,54,y0);g.quadraticCurveTo(0,y0+LD,-54,y0);g.fill();
  g.strokeStyle='#c0182b';g.lineWidth=7;g.beginPath();g.moveTo(-54,y0);g.quadraticCurveTo(0,y0-10,54,y0);g.stroke();
  g.beginPath();g.moveTo(-54,y0);g.quadraticCurveTo(0,y0+LD,54,y0);g.stroke();
  {const tg=g.createLinearGradient(0,y0-8,0,y0+34);tg.addColorStop(0,'#fffdf0');tg.addColorStop(1,'#cbbf8c');g.fillStyle=art?tg:'#efe9cf'}
  for(let i=0;i<10;i++){const x=-46+i*10.2,u=(x+5.1+54)/108,yb=y0-20*u*(1-u)+1;g.beginPath();g.moveTo(x,yb);g.lineTo(x+5.1,yb+15+(rage?8:0));g.lineTo(x+10.2,yb);g.fill()}
  for(let i=0;i<9;i++){const x=-41+i*10.2,u=(x+5.1+54)/108,yb=y0+2*u*(1-u)*LD;g.beginPath();g.moveTo(x,yb+3);g.lineTo(x+5.1,yb-14-(rage?6:0));g.lineTo(x+10.2,yb+3);g.fill()}
  if(rage){g.fillStyle='rgba(180,230,255,.7)';g.fillRect(-20,y0+26,3,40);g.fillRect(10,y0+32,3,52)}
  g.restore();
}
// Cuerpo completo del monstruo azul: brazos largos, manos y pies amarillos
function drawHuggy(x,fy,s,ph,walk){
  g.save();g.translate(x,fy);g.scale(s,s);g.lineCap='round';
  const sw=Math.sin(ph),fur=['#1f4fd0','#2f6bff','#173d9e'],yel='#f0c030',art=artOn();
  const BG=(rx,ry)=>{if(!art)return '#1f4fd0';const q=g.createRadialGradient(-rx*.45,-ry*.3,2,0,0,Math.max(rx,ry)*1.1);q.addColorStop(0,'#4a85ff');q.addColorStop(.45,'#1f4fd0');q.addColorStop(1,'#0b1f66');return q};
  const FUR=(rx,ry,n,len,seed)=>{furEdge(rx,ry,n,len,fur,seed);if(art)furEdge(rx,ry,Math.floor(n*1.7),len*1.35,['#4a85ff','#2f6bff','#10308a'],seed+5)};
  g.translate(0,-(walk?Math.abs(Math.cos(ph))*10:0));
  for(const sd of[-1,1]){
    const lift=walk?Math.max(0,sw*sd)*45:0;
    g.save();g.translate(sd*34,-110-lift);
    g.fillStyle=BG(26,100);g.beginPath();g.ellipse(0,0,26,100,0,0,7);g.fill();FUR(26,100,36,12,sd*5);
    g.fillStyle=yel;g.beginPath();g.ellipse(sd*4,102,38,16,0,0,7);g.fill();g.restore();
  }
  g.save();g.translate(0,-300);g.fillStyle=BG(66,130);g.beginPath();g.ellipse(0,0,66,130,0,0,7);g.fill();FUR(66,130,56,16,11);g.restore();
  for(const sd of[-1,1]){
    g.save();g.translate(sd*70,-405);g.rotate(sd*.1+(walk?sw*sd*.28:Math.sin(ph*.7+sd)*.04));
    g.save();g.translate(0,132);g.fillStyle=BG(22,140);g.beginPath();g.ellipse(0,0,22,140,0,0,7);g.fill();FUR(22,140,40,12,sd*9);g.restore();
    g.fillStyle=yel;g.beginPath();g.arc(0,282,28,0,7);g.fill();for(let k=-1;k<=1;k++){g.beginPath();g.ellipse(k*14,306,8,16,0,0,7);g.fill()}
    g.restore();
  }
  monsterFace(0,-478,1.25,true);
  g.restore();
}

// Zorro peludo de cara terrorífica (capítulo 2)
function foxFace(cx,cy,s,open,rage){
  g.save();g.translate(cx,cy);g.scale(s,s);g.lineCap='round';
  const or='#d9661c',dk='#7a320c',wh='#f3e6d0',det=s>.45;
  for(const sd of[-1,1]){
    g.fillStyle=or;g.beginPath();g.moveTo(sd*62,-26);g.lineTo(sd*54,-104);g.lineTo(sd*12,-54);g.closePath();g.fill();
    g.fillStyle='#2a0c06';g.beginPath();g.moveTo(sd*54,-38);g.lineTo(sd*50,-88);g.lineTo(sd*24,-54);g.closePath();g.fill();
  }
  if(det)furEdge(72,66,64,20,[or,'#f08a3c',dk],7);
  if(artOn())furEdge(72,66,100,26,['#f08a3c',or,dk],19,.09);
  g.fillStyle=or;g.beginPath();g.moveTo(0,-62);g.bezierCurveTo(50,-62,78,-20,72,18);g.bezierCurveTo(66,48,30,70,0,76);g.bezierCurveTo(-30,70,-66,48,-72,18);g.bezierCurveTo(-78,-20,-50,-62,0,-62);g.fill();
  g.fillStyle=wh;g.beginPath();g.moveTo(-72,18);g.bezierCurveTo(-66,48,-30,70,0,76);g.bezierCurveTo(30,70,66,48,72,18);g.bezierCurveTo(40,34,20,10,0,24);g.bezierCurveTo(-20,10,-40,34,-72,18);g.fill();
  if(det){g.lineWidth=2;for(let i=0;i<(artOn()?140:50);i++){const x=(sr(i*2.9)-.5)*140,y=-50+sr(i*4.3)*110;if(x*x/5200+(y+0)*(y+0)/6000>1)continue;
    g.strokeStyle=y>14?'rgba(150,120,90,.45)':(i%2?'rgba(255,160,70,.6)':'rgba(70,25,5,.5)');g.beginPath();g.moveTo(x,y);g.lineTo(x+(sr(i)-.5)*9,y+7+sr(i*1.9)*8);g.stroke()}}
  if(artOn()){const sh=g.createRadialGradient(-26,-30,6,0,10,90);sh.addColorStop(0,'rgba(255,200,140,.35)');sh.addColorStop(.55,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(30,5,0,.5)');g.fillStyle=sh;g.beginPath();g.ellipse(0,6,74,72,0,0,7);g.fill()}
  g.strokeStyle='#5a0d12';g.lineWidth=4;g.beginPath();g.moveTo(-52,-44);g.lineTo(-8,4);g.stroke();
  g.strokeStyle='#e8d8c0';g.lineWidth=2;for(let i=0;i<6;i++){const u=i/5,x=-52+44*u,y=-44+48*u;g.beginPath();g.moveTo(x-4,y+5);g.lineTo(x+4,y-5);g.stroke()}
  for(const sd of[-1,1]){
    g.save();g.translate(sd*30,-12);g.rotate(sd*-.4);
    g.fillStyle=rage?'#ff3b1a':'#ffe44a';g.beginPath();g.ellipse(0,0,15,10,0,0,7);g.fill();
    g.fillStyle='#000';g.beginPath();g.ellipse(0,0,3.2,10,0,0,7);g.fill();if(artOn()){g.fillStyle='rgba(255,255,230,.85)';g.beginPath();g.arc(-5,-4,2.4,0,7);g.fill()}g.restore();
    g.strokeStyle='#120404';g.lineWidth=3;g.beginPath();g.moveTo(sd*30,0);g.quadraticCurveTo(sd*34,22,sd*26,44);g.stroke();
  }
  g.fillStyle='#120404';g.beginPath();g.ellipse(0,34,10,7,0,0,7);g.fill();
  const mh=open?(rage?58:34):12,y0=52,yE=y0-10,LD=mh*2+18;
  g.fillStyle='#14030a';g.beginPath();g.moveTo(-58,yE);g.quadraticCurveTo(0,y0+4,58,yE);g.quadraticCurveTo(0,y0+LD,-58,yE);g.fill();
  {const tg=g.createLinearGradient(0,y0-12,0,y0+40);tg.addColorStop(0,'#fffbea');tg.addColorStop(1,'#c9bd90');g.fillStyle=artOn()?tg:'#f4eedb'}
  for(let i=0;i<11;i++){const x=-58+i*10.5,u=(x+5.25+58)/116,yb=yE+2*u*(1-u)*14;g.beginPath();g.moveTo(x,yb-1);g.lineTo(x+5.25,yb+14+(rage?7:0));g.lineTo(x+10.5,yb-1);g.fill()}
  for(let i=0;i<10;i++){const x=-52.5+i*10.5,u=(x+5.25+58)/116,yb=yE+2*u*(1-u)*LD;g.beginPath();g.moveTo(x,yb+2);g.lineTo(x+5.25,yb-13-(rage?6:0));g.lineTo(x+10.5,yb+2);g.fill()}
  g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=1.5;for(const sd of[-1,1])for(let k=0;k<3;k++){g.beginPath();g.moveTo(sd*52,30+k*5);g.lineTo(sd*(98+k*4),20+k*14);g.stroke()}
  g.restore();
}
function drawFoxBody(x,fy,s,ph,dir,watched,rage){
  g.save();g.translate(x,fy);g.scale(s*dir,s);g.lineCap='round';
  const sw=Math.sin(ph),or='#d9661c',dk='#7a320c',wh='#f3e6d0';
  g.translate(0,-(watched?0:Math.abs(Math.cos(ph))*5));
  g.save();g.translate(-96,-76);g.rotate(-.5+Math.sin(t*.04)*.1);g.translate(-34,0);g.fillStyle=or;g.beginPath();g.ellipse(0,0,64,24,0,0,7);g.fill();furEdge(64,24,26,11,[or,dk,'#f08a3c'],3);g.fillStyle=wh;g.beginPath();g.ellipse(-44,0,20,16,0,0,7);g.fill();g.restore();
  for(const[lx,sg]of[[-62,1],[-26,-1],[44,-1],[78,1]]){const lift=watched?0:Math.max(0,sw*sg)*14;g.fillStyle=dk;g.beginPath();g.ellipse(lx,-30-lift,10,32,0,0,7);g.fill()}
  {let bf=or;if(artOn()){bf=g.createLinearGradient(0,-108,0,-32);bf.addColorStop(0,'#f08a3c');bf.addColorStop(.5,'#d9661c');bf.addColorStop(1,'#6a2a0a')}g.fillStyle=bf}g.beginPath();g.ellipse(0,-70,94,38,0,0,7);g.fill();furEdge(94,38,50,13,[or,dk,'#f08a3c'],5);if(artOn())furEdge(94,38,80,18,['#f08a3c',or,dk],15,.09);
  g.fillStyle=wh;g.beginPath();g.ellipse(14,-50,62,14,0,0,7);g.fill();
  foxFace(104,-64,.72,!watched,!!rage);
  g.restore();
}
function boxArt(b,sx,sy){
  if(artOn()){
    texFill('cardboard',sx,sy,b.w,b.h,'#b98a52',(b.x*7)%64,(b.y*3)%64);
    const sg=g.createLinearGradient(sx,sy,sx+b.w,sy+b.h);sg.addColorStop(0,'rgba(255,240,200,.22)');sg.addColorStop(.5,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,.4)');g.fillStyle=sg;g.fillRect(sx,sy,b.w,b.h);
    g.fillStyle='rgba(60,35,10,.4)';g.fillRect(sx,sy,b.w,5);g.fillRect(sx,sy+b.h-5,b.w,5);g.fillStyle='rgba(255,235,190,.35)';g.fillRect(sx,sy,b.w,1.5);
    const tp=g.createLinearGradient(sx+b.w/2-5,0,sx+b.w/2+5,0);tp.addColorStop(0,'rgba(210,200,160,.55)');tp.addColorStop(.5,'rgba(245,238,205,.7)');tp.addColorStop(1,'rgba(190,180,140,.55)');g.fillStyle=tp;g.fillRect(sx+b.w/2-5,sy,10,b.h);
    g.strokeStyle='rgba(30,15,0,.6)';g.lineWidth=1.5;g.strokeRect(sx+.75,sy+.75,b.w-1.5,b.h-1.5);
    monsterFace(sx+b.w/2,sy+b.h/2+2,.26,false);return;
  }
  g.fillStyle='#b98a52';g.fillRect(sx,sy,b.w,b.h);
  g.fillStyle='#a37641';g.fillRect(sx,sy,b.w,5);g.fillRect(sx,sy+b.h-5,b.w,5);
  g.strokeStyle='#6d4a22';g.lineWidth=2;g.strokeRect(sx+1,sy+1,b.w-2,b.h-2);
  g.fillStyle='rgba(230,220,180,.55)';g.fillRect(sx+b.w/2-5,sy,10,b.h);
  monsterFace(sx+b.w/2,sy+b.h/2+2,.26,false);
}

/* ---------- Fondo de la fábrica ---------- */
function factoryBG(c,tt){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#181b24');gr.addColorStop(1,'#07080b');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // paneles lejanos
  g.fillStyle='rgba(255,255,255,.035)';
  for(let i=-1;i<12;i++){const x=i*140-((c*.25)%140);g.fillRect(x,40,120,GR-60)}
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=3;
  for(let i=-1;i<12;i++){const x=i*140-((c*.25)%140)+130;g.beginPath();g.moveTo(x,0);g.lineTo(x,GR);g.stroke()}
  if(artOn())wallArt(c);
  // tuberías
  for(const[py,col]of[[70,'#2a303c'],[118,'#232833']]){
    g.fillStyle=col;g.fillRect(0,py,W,22);g.fillStyle='rgba(255,255,255,.07)';g.fillRect(0,py+3,W,4);
    for(let i=-1;i<14;i++){const x=i*120-((c*.5)%120);g.fillStyle='#3a404e';g.fillRect(x,py-3,10,28)}
  }
  if(artOn())pipeArt();
  // engranajes
  for(let i=0;i<4;i++){
    const gx=((i*520-c*.55)%2080+2080)%2080-250,gy=240+(i%2)*70,r=60+(i%3)*14,dir=i%2?1:-1;
    g.save();g.translate(gx,gy);g.rotate(tt*.012*dir);g.fillStyle='#262b36';
    for(let k=0;k<12;k++){g.rotate(Math.PI/6);g.fillRect(-7,-r-10,14,22)}
    g.beginPath();g.arc(0,0,r,0,7);g.fill();g.fillStyle='#14171e';g.beginPath();g.arc(0,0,r*.4,0,7);g.fill();g.restore();
  }
  // lámparas
  for(let i=0;i<6;i++){
    const lx=((i*430-c*.8)%2580+2580)%2580-200,fl=(Math.sin(tt*.07+i*5)>.92||Math.sin(tt*.031+i)>.97)?.25:1;
    g.fillStyle='#111';g.fillRect(lx-1,0,2,50);g.fillStyle='#3b3b2a';g.fillRect(lx-14,50,28,10);
    if(S.hq){const gl=g.createRadialGradient(lx,60,2,lx,60,230);gl.addColorStop(0,`rgba(255,220,130,${.35*fl})`);gl.addColorStop(1,'rgba(255,220,130,0)');g.fillStyle=gl;g.fillRect(lx-230,0,460,GR)}
    g.fillStyle=`rgba(255,235,170,${fl})`;g.fillRect(lx-9,58,18,5);
  }
  // suelo
  const fg=g.createLinearGradient(0,GR,0,H);fg.addColorStop(0,'#2b2e37');fg.addColorStop(1,'#101116');
  g.fillStyle=fg;g.fillRect(0,GR,W,H-GR);
  for(let i=-1;i<W/40+2;i++){const x=i*40-(c%40);g.fillStyle=(i+Math.floor(c/40))%2?'#f2c21b':'#15151a';
    g.beginPath();g.moveTo(x,GR);g.lineTo(x+20,GR);g.lineTo(x+12,GR+8);g.lineTo(x-8,GR+8);g.fill()}
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=2;
  for(let i=-1;i<W/80+2;i++){const x=i*80-(c%80);g.beginPath();g.moveTo(x,GR+8);g.lineTo(x-30,H);g.stroke()}
  if(artOn())floorArt(c,tt);
}
function vignette(cx,cy){
  const v=g.createRadialGradient(cx,cy,120,cx,cy,640);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.78)');
  g.fillStyle=v;g.fillRect(0,0,W,H);
}


/* ---------- Estilo artístico Dedicado (realista: texturas, luces, sombras y reflejos) ---------- */
const TEX={};let LC=null;
const artOn=()=>{if(S.art&&S.hq){if(!TEX.ok)initTex();return true}return false};
const ultraOn=()=>!!(S.ultra&&S.art&&S.hq);
function mkTex(name,w,h,fn){try{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);TEX[name]=g.createPattern(c,'repeat')}catch(e){TEX[name]=null}}
function initTex(){
  TEX.ok=1;const R=Math.random;
  mkTex('cardboard',64,64,(x,w,h)=>{x.fillStyle='#b98a52';x.fillRect(0,0,w,h);
    for(let i=0;i<w;i+=4){x.fillStyle=i%8?'rgba(255,230,170,.10)':'rgba(70,40,10,.12)';x.fillRect(i,0,2,h)}
    for(let i=0;i<260;i++){x.fillStyle=R()<.5?'rgba(60,35,10,.18)':'rgba(255,240,200,.14)';x.fillRect(R()*w,R()*h,1+R()*2,1)}
    x.strokeStyle='rgba(80,50,20,.12)';for(let i=0;i<24;i++){const y=R()*h;x.beginPath();x.moveTo(R()*w,y);x.lineTo(R()*w,y+R()*4-2);x.stroke()}});
  mkTex('wood',128,64,(x,w,h)=>{x.fillStyle='#8f5f30';x.fillRect(0,0,w,h);
    for(let i=0;i<60;i++){const y=R()*h;x.strokeStyle=R()<.5?'rgba(50,25,8,.28)':'rgba(220,170,110,.18)';x.lineWidth=.6+R()*1.2;x.beginPath();x.moveTo(0,y);for(let k=0;k<=w;k+=16)x.lineTo(k,y+Math.sin(k*.05+i)*2.2);x.stroke()}
    for(let i=0;i<3;i++){const kx=R()*w,ky=R()*h,gr=x.createRadialGradient(kx,ky,0,kx,ky,9);gr.addColorStop(0,'rgba(40,18,5,.8)');gr.addColorStop(1,'rgba(40,18,5,0)');x.fillStyle=gr;x.fillRect(kx-9,ky-9,18,18)}});
  mkTex('metal',128,128,(x,w,h)=>{x.fillStyle='#626874';x.fillRect(0,0,w,h);
    for(let i=0;i<220;i++){x.strokeStyle=R()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)';x.lineWidth=.5+R();const y=R()*h;x.beginPath();x.moveTo(0,y);x.lineTo(w,y+R()*2-1);x.stroke()}
    for(let i=0;i<14;i++){x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=.6;const px=R()*w,py=R()*h;x.beginPath();x.moveTo(px,py);x.lineTo(px+R()*22-11,py+R()*8-4);x.stroke()}
    for(let i=0;i<6;i++){const rx=R()*w,ry=R()*h,gr=x.createRadialGradient(rx,ry,0,rx,ry,14);gr.addColorStop(0,'rgba(120,60,20,.28)');gr.addColorStop(1,'rgba(120,60,20,0)');x.fillStyle=gr;x.fillRect(rx-14,ry-14,28,28)}});
  mkTex('concrete',256,128,(x,w,h)=>{x.fillStyle='#3b3e48';x.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){x.fillStyle=R()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.14)';x.fillRect(R()*w,R()*h,1+R()*2,1+R()*2)}
    for(let i=0;i<5;i++){const sx=R()*w,sy=R()*h,gr=x.createRadialGradient(sx,sy,0,sx,sy,30);gr.addColorStop(0,'rgba(0,0,0,.25)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(sx-30,sy-30,60,60)}
    x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;for(let i=0;i<3;i++){let cx=R()*w,cy=R()*h;x.beginPath();x.moveTo(cx,cy);for(let k=0;k<7;k++){cx+=R()*18-9;cy+=R()*10;x.lineTo(cx,cy)}x.stroke()}});
  mkTex('grain',128,128,(x,w,h)=>{const d=x.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const v=R()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0)});
}
function texFill(name,x,y,w,h,fb,ox,oy){
  if(TEX[name]){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x-(ox||0),y-(oy||0));g.fillStyle=TEX[name];g.fillRect(ox||0,oy||0,w,h);g.restore()}
  else{g.fillStyle=fb;g.fillRect(x,y,w,h)}
}
function metalRect(x,y,w,h){
  texFill('metal',x,y,w,h,'#4a5060');
  const gr=g.createLinearGradient(x,y,x,y+h);gr.addColorStop(0,'rgba(255,255,255,.24)');gr.addColorStop(.15,'rgba(255,255,255,.05)');gr.addColorStop(.85,'rgba(0,0,0,.2)');gr.addColorStop(1,'rgba(0,0,0,.5)');
  g.fillStyle=gr;g.fillRect(x,y,w,h);
  if(w>14){const sh=((t*.6+x*.3)%(w+80))-40,sg=g.createLinearGradient(x+sh-30,0,x+sh+30,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.13)');sg.addColorStop(1,'rgba(255,255,255,0)');
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle=sg;g.fillRect(x,y,w,h);g.restore()}
  g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1;g.beginPath();g.moveTo(x,y+.5);g.lineTo(x+w,y+.5);g.stroke();
  g.strokeStyle='rgba(0,0,0,.55)';g.strokeRect(x+.5,y+.5,w-1,h-1);
}
function metalArtCrate(x,y,w,h){
  metalRect(x,y,w,h);
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=4;g.strokeRect(x+5,y+5,w-10,h-10);
  g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1.5;g.strokeRect(x+3,y+3,w-6,h-6);
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=3;g.beginPath();g.moveTo(x+5,y+5);g.lineTo(x+w-5,y+h-5);g.moveTo(x+w-5,y+5);g.lineTo(x+5,y+h-5);g.stroke();
  for(const[a,b]of[[9,9],[w-9,9],[9,h-9],[w-9,h-9]]){g.fillStyle='#2a2d34';g.beginPath();g.arc(x+a,y+b,3.2,0,7);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(x+a-1,y+b-1,1.1,0,7);g.fill()}
}
function drawPillarArt(px){
  texFill('concrete',px,pillar.y,pillar.w,pillar.h,'#3a3f4b');
  const gr=g.createLinearGradient(px,0,px+pillar.w,0);gr.addColorStop(0,'rgba(255,255,255,.14)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=gr;g.fillRect(px,pillar.y,pillar.w,pillar.h);
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;for(let y=pillar.y+30;y<GR;y+=30){g.beginPath();g.moveTo(px,y);g.lineTo(px+pillar.w,y);g.stroke();g.strokeStyle='rgba(255,255,255,.08)';g.beginPath();g.moveTo(px,y+2);g.lineTo(px+pillar.w,y+2);g.stroke();g.strokeStyle='rgba(0,0,0,.45)'}
  for(let i=0;i<4;i++){const rg=g.createLinearGradient(0,pillar.y,0,GR);rg.addColorStop(0,'rgba(110,55,20,.45)');rg.addColorStop(1,'rgba(110,55,20,0)');g.fillStyle=rg;g.fillRect(px+10+i*20,pillar.y+8,4,80+i*16)}
  metalRect(px-3,pillar.y,pillar.w+6,10);
  for(let y=pillar.y+22;y<GR-10;y+=30)for(const rx of[px+8,px+pillar.w-12]){g.fillStyle='#22252c';g.beginPath();g.arc(rx+3,y+3,3,0,7);g.fill();g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(rx+2,y+2,1,0,7);g.fill()}
}
function lampList(c,tt){
  const out=[];
  if(ch===2){for(let i=0;i<5;i++){const lx=((i*430-c*.8)%2150+2150)%2150-200;out.push({x:lx,y:76,fl:Math.sin(tt*.07+i*5)>.93?.25:1,col:'255,175,125'})}}
  else{for(let i=0;i<6;i++){const lx=((i*430-c*.8)%2580+2580)%2580-200;out.push({x:lx,y:60,fl:(Math.sin(tt*.07+i*5)>.92||Math.sin(tt*.031+i)>.97)?.25:1,col:'255,222,140'})}}
  return out;
}
function floorArt(c,tt){
  g.save();g.globalAlpha=.55;g.beginPath();g.rect(0,GR,W,H-GR);g.clip();
  if(TEX.concrete){g.translate(-(c%256),GR);g.fillStyle=TEX.concrete;g.fillRect(0,0,W+256,H-GR)}
  g.restore();
  const gl=g.createLinearGradient(0,GR,0,H);gl.addColorStop(0,'rgba(200,215,240,.14)');gl.addColorStop(.35,'rgba(200,215,240,.04)');gl.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=gl;g.fillRect(0,GR,W,H-GR);
  for(const lp of lampList(c,tt)){const sg=g.createLinearGradient(0,GR,0,H);sg.addColorStop(0,`rgba(${lp.col},${.12*lp.fl})`);sg.addColorStop(1,`rgba(${lp.col},0)`);g.fillStyle=sg;g.fillRect(lp.x-7,GR,14,H-GR)}
  for(let i=0;i<4;i++){

function strokePts(pts,yo){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]+yo):g.moveTo(q[0],q[1]+yo));g.stroke()}
function drawCable(x1,y1,x2,y2,h){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,seg=Math.max(8,Math.floor(d/9));
  const taut=h.st==='hold'||h.st==='anchor'||h.st==='plug'||h.st==='zip'||h.st==='pull';
  const sag=taut?0:Math.min(16,d*.05),amp=taut?(h.shock>0?4:.7):h.wave*Math.min(18,d*.1),pts=[];
  for(let i=0;i<=seg;i++){const u=i/seg,env=Math.sin(u*Math.PI),w2=env*amp*Math.sin(u*10-t*.55);pts.push([x1+dx*u+nx*w2,y1+dy*u+ny*w2+env*sag])}
  g.lineCap='round';g.lineJoin='round';
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=9;strokePts(pts,3);
  g.strokeStyle='#6b5200';g.lineWidth=8;strokePts(pts,0);
  g.strokeStyle=taut&&h.shock>0?'#fff3b0':'#f2c21b';g.lineWidth=5.5;strokePts(pts,0);
  g.strokeStyle='rgba(255,246,190,.75)';g.lineWidth=1.6;strokePts(pts,-1.5);
  g.strokeStyle='#8a6a00';g.lineWidth=1.6;
  for(let i=1;i<seg;i+=1){const p=pts[i],q=pts[i+1],an=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2;g.beginPath();g.moveTo(p[0]-Math.cos(an)*2.8,p[1]-Math.sin(an)*2.8);g.lineTo(p[0]+Math.cos(an)*2.8,p[1]+Math.sin(an)*2.8);g.stroke()}
}

let AC=null,AUD=null;
function startMusic(){
  try{
    ac();if(!AC)return;
    stopMusic();stopAmbient();stopMenuMusic();
    // El modo de sonidos terroríficos reemplaza por completo la música por ambiente oscuro.
    if(terrorSounds){startAmbient();return;}
    const n0=AC.currentTime+.15,master=AC.createGain();master.gain.value=.42;master.connect(AC.destination);AUD={master};
    // Dos temas diferentes, lentos y disonantes, uno por capítulo.
    const mel=ch===1?[196,0,207,0,233,220,0,196,174,0,185,0,207,196,155,0]:[147,0,155,0,174,0,164,0,138,0,155,0,130,0,147,0];
    const step=ch===1?.78:.92;
    for(let i=0;i<48;i++){
      const note=mel[i%mel.length];if(!note)continue;
      const st=n0+1+i*step, f=note*(i%16>=12?.5:1);
      for(const[mul,vol,type]of[[1,.105,'triangle'],[1.006,.075,'sawtooth'],[2,.018,'sine']]){
        const o=AC.createOscillator(),gn=AC.createGain(),lp=AC.createBiquadFilter();o.type=type;o.frequency.value=f*mul;
        lp.type='lowpass';lp.frequency.value=type==='sawtooth'?550:1200;
        gn.gain.setValueAtTime(0,st);gn.gain.linearRampToValueAtTime(vol,st+.08);gn.gain.setValueAtTime(vol,st+.3);gn.gain.exponentialRampToValueAtTime(.0005,st+step*1.35);
        o.connect(lp);lp.connect(gn);gn.connect(master);o.start(st);o.stop(st+step*1.4);
      }
    }
    // Zumbido de fábrica y nota grave sostenida bajo la melodía.
    const dr=AC.createOscillator(),lp=AC.createBiquadFilter(),dg=AC.createGain();dr.type='sawtooth';dr.frequency.value=ch===1?43:38;lp.type='lowpass';lp.frequency.value=105;
    dg.gain.setValueAtTime(.001,n0);dg.gain.linearRampToValueAtTime(.065,n0+3);dg.gain.setValueAtTime(.065,n0+34);dg.gain.linearRampToValueAtTime(.001,n0+38);
    dr.connect(lp);lp.connect(dg);dg.connect(master);dr.start(n0);dr.stop(n0+38.5);
    // Gemido tonal lejano que se desliza lentamente.
    const wh=AC.createOscillator(),wf=AC.createBiquadFilter(),wg=AC.createGain();wh.type='sine';wh.frequency.setValueAtTime(ch===1?310:260,n0+8);wh.frequency.exponentialRampToValueAtTime(ch===1?95:78,n0+23);
    wf.type='bandpass';wf.frequency.value=ch===1?450:350;wf.Q.value=2;wg.gain.setValueAtTime(.001,n0+8);wg.gain.linearRampToValueAtTime(.045,n0+15);wg.gain.exponentialRampToValueAtTime(.001,n0+24);
    wh.connect(wf);wf.connect(wg);wg.connect(master);wh.start(n0+8);wh.stop(n0+24.5);
  }catch(e){}
}

function ton(T,f,dur,type,vol,dest,att,f1){

let last=performance.now(),acc=0;
function frame(now){
